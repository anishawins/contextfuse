<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ContextFuse</title>
<style>
:root{--bg:#0f1210;--panel:#171b15;--line:#2a3124;--ink:#e8ebe3;--dim:#9aa393;
      --accent:#a8c957;--warn:#d69445;--vis:#5b9bd5;--txt:#a8c957}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.5 ui-sans-serif,-apple-system,system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
       padding:18px 20px;z-index:10}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0 0 12px;font-size:17px;letter-spacing:.02em;font-weight:650}
h1 span{color:var(--dim);font-weight:400;margin-left:10px;font-size:13px}
form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 340px;min-width:0;background:var(--panel);border:1px solid var(--line);
   color:var(--ink);padding:11px 14px;border-radius:7px;font-size:15px;outline:none}
input[type=search]:focus{border-color:var(--accent)}
.slider{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);
        background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:7px}
input[type=range]{width:110px;accent-color:var(--accent)}
button{background:var(--accent);color:#12160e;border:0;padding:11px 20px;border-radius:7px;
       font-weight:650;cursor:pointer;font-size:14px}
button:disabled{opacity:.5;cursor:default}
#meta{color:var(--dim);font-size:12.5px;padding:14px 20px 0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:16px;padding:14px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;
      display:flex;flex-direction:column}
.thumb{position:relative;background:#0a0c09;aspect-ratio:3/4;overflow:hidden;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.rk{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.72);color:var(--accent);
    font:650 11px ui-monospace,monospace;padding:3px 7px;border-radius:4px}
.body{padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.fn{font:12px ui-monospace,monospace;color:var(--dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;align-items:center;gap:7px;font:11px ui-monospace,monospace;color:var(--dim)}
.bar b{width:38px;font-weight:400}
.track{flex:1;height:5px;background:#252b1f;border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px}
.why{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.5px;padding:2.5px 7px;border-radius:4px;background:#232a1c;color:var(--dim)}
.tag.hit{background:#2c3a18;color:var(--accent)}
.tag.warn{background:#33281a;color:var(--warn)}
.snip{font-size:11.5px;color:var(--dim);background:#12160f;border-left:2px solid var(--line);
      padding:6px 8px;border-radius:0 4px 4px 0;max-height:54px;overflow:hidden}
#empty{padding:60px 20px;text-align:center;color:var(--dim)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;
    justify-content:center;z-index:50;cursor:zoom-out;padding:24px}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.ex{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.ex button{background:#232a1c;color:var(--dim);font-weight:400;font-size:12px;padding:5px 11px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>ContextFuse <span id="stat">loading…</span></h1>
  <form id="f">
    <input type="search" id="q" placeholder="what are you looking for?" autocomplete="off" autofocus>
    <label class="slider"><input type="checkbox" id="auto" checked>&nbsp;auto</label>
    <label class="slider" id="manual">OCR&nbsp;<input type="range" id="a" min="0" max="1" step="0.05" value="0.6">
      <span id="av">0.60</span>&nbsp;visual</label>
    <button id="go" type="submit">Search</button>
  </form>
  <div class="ex">
    <button type="button" data-q="vellore">vellore</button>
    <button type="button" data-q="a screenshot of a chat conversation">chat conversation</button>
    <button type="button" data-q="code on a dark background">code, dark background</button>
    <button type="button" data-q="assessment marks">assessment marks</button>
    <button type="button" data-q="logical reasoning question">logical reasoning question</button>
  </div>
</div></header>

<div id="meta"></div>
<div id="grid"></div>
<div id="empty">Search your indexed images.</div>
<div id="lb"><img id="lbi" alt=""></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/api/stats').then(r=>r.json()).then(s=>{
  $('#stat').textContent =
    `${s.images} images · ${s.with_text} with text · ${s.without_text} image-only · ${s.vocabulary} terms`;
});

$('#a').oninput = e => $('#av').textContent = (+e.target.value).toFixed(2);
$('#auto').onchange = e => $('#manual').style.opacity = e.target.checked ? .45 : 1;
$('#manual').style.opacity = .45;
document.querySelectorAll('.ex button').forEach(b =>
  b.onclick = () => { $('#q').value = b.dataset.q; $('#f').requestSubmit(); });

$('#f').onsubmit = async e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return;
  $('#go').disabled = true;
  $('#meta').textContent = 'searching…';
  try {
    const al = $('#auto').checked ? -1 : $('#a').value;
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&k=12&alpha=${al}`);
    if (!r.ok) throw new Error(`server said ${r.status}`);
    render(await r.json());
  } catch (err) {
    $('#meta').textContent = 'Search failed: ' + err.message;
    $('#grid').innerHTML = '';
  } finally { $('#go').disabled = false; }
};

function render(d){
  $('#empty').style.display = d.hits.length ? 'none' : 'block';
  $('#empty').textContent = d.hits.length ? '' : 'Nothing matched. Try different words.';
  $('#meta').innerHTML =
    `${d.returned} of ${d.total_indexed} · ${d.took_ms} ms · OCR weight <b>${d.alpha}</b>` +
    (d.alpha_auto ? ` <span style="color:#a8c957">auto</span> — ${esc(d.alpha_reason)}` : '');
  $('#grid').innerHTML = d.hits.map(h => `
    <div class="card">
      <div class="thumb" data-id="${h.id}">
        <span class="rk">#${h.rank}</span>
        <img loading="lazy" src="/image/${h.id}?w=520" alt="${esc(h.filename)}">
      </div>
      <div class="body">
        <div class="fn" title="${esc(h.filename)}">${esc(h.filename)}</div>
        <div class="bars">
          <div class="bar"><b>text</b><div class="track">
            <div class="fill" style="width:${h.text*100}%;background:var(--txt)"></div>
          </div>${h.text.toFixed(2)}</div>
          <div class="bar"><b>visual</b><div class="track">
            <div class="fill" style="width:${h.visual*100}%;background:var(--vis)"></div>
          </div>${h.visual.toFixed(2)}</div>
        </div>
        <div class="why">
          ${h.matched_terms.map(t=>`<span class="tag hit">${esc(t)}</span>`).join('')}
          ${h.reasons.filter(r=>!r.startsWith('exact text'))
             .map(r=>`<span class="tag${r.includes('low OCR')?' warn':''}">${esc(r)}</span>`).join('')}
          <span class="tag">${esc(h.date)}</span>
        </div>
        ${h.snippet ? `<div class="snip">${esc(h.snippet)}</div>` : ''}
      </div>
    </div>`).join('');

  document.querySelectorAll('.thumb').forEach(t => t.onclick = () => {
    $('#lbi').src = `/image/${t.dataset.id}?w=1600`;
    $('#lb').style.display = 'flex';
  });
}
$('#lb').onclick = () => $('#lb').style.display = 'none';
</script>
</body>
</html>
